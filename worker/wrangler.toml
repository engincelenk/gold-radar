name = "gold-radar-wecker"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = false          # keine öffentliche workers.dev-Adresse, der Worker braucht keine

[triggers]
crons = ["0 6,10,14,18,22 * * *"]     # 5-mal am Tag (UTC); 22 Uhr = Tagesabschluss mit Push-Nachricht

# Secret GITHUB_TOKEN wird NICHT hier eingetragen, sondern mit:  npx wrangler secret put GITHUB_TOKEN
