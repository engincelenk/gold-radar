name: Gold-Radar Update

# Auslöser:
#  1. Cloudflare-Worker "gold-radar-wecker" (siehe worker/): startet alle 15 Minuten auf die Minute genau per workflow_dispatch (source=cloudflare)
#  2. Reserve-Zeitplan von GitHub (Best Effort, oft verspätet). Läuft nur, wenn der Stand älter als 10 Minuten ist
#  3. Manuell ("Run workflow") und nach Code-Änderungen (Push)
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # versetzt zu :00/:15/:30/:45, wo GitHub am stärksten ausgelastet ist
  workflow_dispatch:
    inputs:
      source:
        description: "Auslöser: manual oder cloudflare (der Wecker setzt cloudflare)"
        default: manual
  push:
    branches: [main]
    paths: ["scripts/**", "requirements.txt", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: gold-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # "true" bei automatischen Läufen (Wecker oder Zeitplan): Push-Nachricht und Tages-Snapshot nur um 22 Uhr UTC
      AUTO: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'cloudflare' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # volle Historie: der Tages-Snapshot prüft, wann data.json zuletzt in main committet wurde
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (Nachrichten-Regeln)
        run: python -m unittest discover -s tests

      # Der aktuelle Stand liegt im Branch "data" (wird bei jedem Lauf überschrieben, wächst also nicht).
      # Daraus kommen Signal-Verlauf, letzter gemeldeter Stand und Nachrichten-Fallback.
      - name: Letzten Stand laden
        run: |
          if git fetch origin data && git show FETCH_HEAD:data.json > /tmp/prev.json; then
            mv /tmp/prev.json docs/data.json
          else
            echo "Noch kein data-Branch, nutze docs/data.json aus main"
          fi

      - name: Reservelauf überspringen, wenn der Stand frisch ist
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          skip = False
          try:
              age = datetime.now(timezone.utc) - datetime.fromisoformat(json.load(open("docs/data.json", encoding="utf-8"))["updated"])
              skip = age.total_seconds() < 600
              print(f"Stand ist {age.total_seconds() / 60:.0f} Min. alt -> " + ("überspringen" if skip else "aktualisieren"))
          except Exception as e:
              print(f"Alter nicht lesbar ({e}) -> aktualisieren")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Daten holen, Signal berechnen, Nachrichten auswerten, ggf. benachrichtigen
        if: steps.fresh.outputs.skip != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_DAILY: ${{ vars.NOTIFY_DAILY }}
        run: |
          # Push-Nachrichten nur im Tagesabschluss-Lauf (22 Uhr UTC) und bei manuellem/Code-Start
          if [ "$AUTO" != "true" ] || [ "$(date -u +%H)" = "22" ]; then NOTIFY="--notify"; fi
          python scripts/update.py $NOTIFY

      - name: Aktuellen Stand im Branch "data" veröffentlichen
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "gold-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          blob=$(git hash-object -w docs/data.json)
          tree=$(printf '100644 blob %s\tdata.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Daten $(date -u +%FT%H:%MZ)")
          git push --force origin "$commit:refs/heads/data"

      # Einmal pro Tag (22 Uhr UTC) ein Snapshot in main: Rückfall für die Seite, falls der data-Branch nicht erreichbar ist.
      - name: Tages-Snapshot in main committen
        if: steps.fresh.outputs.skip != 'true'
        run: |
          last=$(git log -1 --format=%ct -- docs/data.json)
          if [ "$AUTO" != "true" ] || { [ "$(date -u +%H)" = "22" ] && [ $(( $(date +%s) - last )) -gt 10800 ]; }; then
            git add docs/data.json
            git diff --staged --quiet || git commit -m "Update $(date -u +%F)"
            git pull --rebase
            git push
          fi
