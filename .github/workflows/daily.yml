name: Gold-Radar Update

on:
  schedule:
    - cron: "30 21 * * 1-5"   # Mo–Fr 21:30 UTC, nach US-Handelsschluss
  workflow_dispatch: {}        # manuell startbar ("Run workflow")
  push:                        # nach Code-Änderungen sofort neu rechnen (der Bot committet nur docs/data.json, das löst nichts aus)
    branches: [main]
    paths: ["scripts/**", "requirements.txt", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: gold-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests (Nachrichten-Regeln)
        run: python -m unittest discover -s tests
      - name: Daten holen, Signal berechnen, Nachrichten auswerten, ggf. benachrichtigen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_DAILY: ${{ vars.NOTIFY_DAILY }}
        run: python scripts/update.py
      - name: Ergebnis committen
        run: |
          git config user.name "gold-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "Update $(date -u +%F)"
          git pull --rebase
          git push
